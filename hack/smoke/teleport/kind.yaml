kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: teleport
# All three smoke clusters (teleport / producer / consumer) sit on the
# default `kind` Docker network so peer clusters can reach this one's
# proxy by container IP plus the NodePort pinned in
# proxy-nodeport.yaml. No host-port mappings, so nothing here
# constrains that port choice — see runbook step 1.
nodes:
  - role: control-plane
