# teleport-cluster Helm chart values for the smoke environment.
# Pinned to chart version 18.7.3 — bump in lockstep with the producer's
# teleport-kube-agent and the smoke runbook.
#
# This config is INTENTIONALLY MINIMAL and INSECURE for a kind smoke
# test. Do not copy into production.

# Self-signed certs are fine for smoke — peer clusters connect with
# --insecure or the discovered IP will not match a cert SAN anyway.
clusterName: smoke.tunnelport.local

# publicAddr is what the proxy advertises to clients (kube-agent, tbot)
# for reverse-tunnel reconnects. Without it the proxy hands out
# "smoke.tunnelport.local:443" and peer kind clusters cannot resolve
# that name.
#
# This placeholder MUST be substituted before the chart is installed —
# it is never installed as-is. run.sh (and the runbook) compute
# "<control-plane container IP>:<pinned NodePort>" up front and sed it
# in, so the proxy comes up advertising the real address on its first
# and only start. A proxy that ever runs with the placeholder
# registers a proxy heartbeat carrying it; the heartbeat outlives the
# pod by its announce TTL, and the producer's app agent then derives
# smoke-app's public address from whichever heartbeat it happens to
# read. That was the ~50% e2e-smoke flake in #92.
publicAddr:
  - "REPLACE_WITH_TELEPORT_PROXY_ADDR"

# multiplex serves all Teleport protocols (proxy SSH, app, kube, tunnel)
# over a single TLS port so peer clusters only need ":443".
proxyListenerMode: multiplex

# No public DNS in kind, so disable cert provisioning. The chart falls
# back to a self-signed CA which Teleport regenerates on install.
acme: false

# Peer kind clusters reach the proxy over the kind Docker network via
# the control-plane node container's IP and a NodePort — but NOT this
# Service's. The chart offers no nodePort knob: it splices
# `service.spec` into the Service and then emits its own hardcoded
# `ports:` list, so a `service.spec.ports` here renders a duplicate
# YAML key and the chart's copy (no nodePort) wins. The port would be
# auto-assigned, hence unknowable until after the install — which is
# exactly what forced the old two-pass install and the flake in #92.
#
# So the proxy's ingress path is hack/smoke/teleport/proxy-nodeport.yaml,
# a Service we own on a pinned port, and the chart's Service is
# ClusterIP. (LoadBalancer is the chart default, but kind has no LB
# controller — the Service would sit Pending forever.)
service:
  type: ClusterIP

# Single-replica auth + proxy is enough for smoke; the chart's default
# storage backend (sqlite on a PVC) is fine because we tear the cluster
# down after the test.
chartMode: standalone

# Resource budget: kind nodes are constrained. Trim defaults so the
# smoke test fits on a developer laptop.
highAvailability:
  replicaCount: 1
