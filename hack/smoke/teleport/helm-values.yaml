# teleport-cluster Helm chart values for the smoke environment.
# Pinned to chart version 18.7.3 — bump in lockstep with the producer's
# teleport-kube-agent and the smoke runbook.
#
# This config is INTENTIONALLY MINIMAL and INSECURE for a kind smoke
# test. Do not copy into production.

# Self-signed certs are fine for smoke — peer clusters connect with
# --insecure or the discovered IP will not match a cert SAN anyway.
clusterName: smoke.tunnelport.local

# publicAddr is what the proxy advertises to clients (kube-agent, tbot)
# for reverse-tunnel reconnects. Without it the proxy hands out
# "smoke.tunnelport.local:443" and peer kind clusters cannot resolve
# that name. Replace via `helm upgrade --set` after the
# teleport-control-plane node IP is discovered (see runbook step 2).
# The placeholder here keeps the chart installable on first try; the
# runbook re-installs with the real IP.
publicAddr:
  - "REPLACE_WITH_TELEPORT_PROXY_ADDR"

# multiplex serves all Teleport protocols (proxy SSH, app, kube, tunnel)
# over a single TLS port so peer clusters only need ":443".
proxyListenerMode: multiplex

# No public DNS in kind, so disable cert provisioning. The chart falls
# back to a self-signed CA which Teleport regenerates on install.
acme: false

# Expose the proxy as NodePort so peer kind clusters can reach it on
# the kind Docker network via the control-plane node container's IP.
# (LoadBalancer is the chart default, but kind has no LB controller —
# the Service would sit Pending forever.)
service:
  type: NodePort
  spec:
    ports:
      - name: tls
        port: 443
        targetPort: 3080
        nodePort: 30443
        protocol: TCP

# Single-replica auth + proxy is enough for smoke; the chart's default
# storage backend (sqlite on a PVC) is fine because we tear the cluster
# down after the test.
chartMode: standalone

# Resource budget: kind nodes are constrained. Trim defaults so the
# smoke test fits on a developer laptop.
highAvailability:
  replicaCount: 1
