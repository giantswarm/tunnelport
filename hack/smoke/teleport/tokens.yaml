# Bot join token for the smoke environment.
#
# tunnelport-smoke-app    — used by the consumer cluster's tbot
#   (rendered by the operator) to join as the tunnelport-smoke-app
#   identity. Role: [Bot]. join_method: kubernetes with
#   `kubernetes.type: static_jwks` per ADR 0006.
#
#   The consumer kind cluster's JWKS is templated into
#   `kubernetes.static_jwks.jwks` by run.sh after the consumer
#   cluster is up — Teleport validates the projected SA token
#   offline against this JWKS, so no network reachability from
#   Teleport to the consumer apiserver is required.
#
#   `kubernetes.allow.service_account` matches the per-RemoteApp SA
#   the operator renders in the consumer cluster: namespace=`smoke`,
#   name=`smoke-app` (slice 01's convention: SA name = cr.Name).
#
# The token resource name MUST match the operator's `onboarding.token`
# convention `tunnelport-${cr.Name}` (locked in ADR 0006 / slice 02).
#
# The producer-agent-token used by `teleport-kube-agent` is generated
# dynamically by run.sh via `tctl tokens add --type=node,app`; it does
# NOT live in this file.
kind: token
version: v2
metadata:
  name: tunnelport-smoke-app
spec:
  roles:
    - Bot
  bot_name: tunnelport-smoke-app
  join_method: kubernetes
  kubernetes:
    type: static_jwks
    static_jwks:
      jwks: REPLACE_WITH_CONSUMER_JWKS
    allow:
      - service_account: "smoke:smoke-app"
