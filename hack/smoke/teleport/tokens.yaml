# Three join tokens for the smoke environment.
#
#  1) producer-agent-token  — used by the producer cluster's
#     teleport-kube-agent to register the smoke app with Teleport.
#     Roles: [Node, App]. Static token (the producer-side agent is
#     not the migration target).
#
#  2) smoke-bot-token       — used by the consumer cluster's tbot
#     (rendered by the operator) to join as the smoke-bot identity.
#     Role: [Bot]. Join method `kubernetes` with `static_jwks` trust
#     per ADR 0004. The placeholder `static_jwks.jwks` value is
#     replaced at smoke-time with the consumer kind cluster's
#     `/openid/v1/jwks` document (see hack/smoke/run.sh).
#
#  3) tunnelport-trust-bundle-token — used by the chart-managed
#     singleton trust-bundle tbot (ADR 0008) to join as
#     `tunnelport-trust-bundle-bot`. Same kubernetes-join shape as
#     #2 (same JWKS substituted at smoke-time), but the `allow` rule
#     pins a DIFFERENT ServiceAccount — the chart's
#     `<release>-trust-bundle` SA in `tunnelport-system`.
#
# Apply with:
#   tctl create -f hack/smoke/teleport/tokens.yaml
#
# The runbook captures the literal producer-agent-token string —
# that's still a static token. The kubernetes-method bot token has
# no value to capture: tbot proves its identity with the consumer
# cluster's projected SA JWT, and Teleport validates it against the
# JWKS pinned on this token.
kind: token
version: v2
metadata:
  name: producer-agent-token
spec:
  roles:
    - Node
    - App
  join_method: token
  # Replace before applying. Generate one with:
  #   openssl rand -hex 16
  token: REPLACE_WITH_PRODUCER_AGENT_TOKEN
---
kind: token
version: v2
metadata:
  name: smoke-bot-token
spec:
  roles:
    - Bot
  bot_name: smoke-bot
  join_method: kubernetes
  kubernetes:
    type: static_jwks
    static_jwks:
      # Replaced at smoke-time with the consumer kind cluster's
      # `/openid/v1/jwks` document. Block scalar (`|`) so any future
      # JWKS bytes (long base64 modulus values, etc.) are not at the
      # mercy of YAML line-length quirks; run.sh indents the JSON to
      # match the 8-space lead below.
      jwks: |
        REPLACE_WITH_CONSUMER_JWKS
    allow:
      # The ServiceAccount projected JWT the rendered tbot pod
      # presents. The operator renders one SA per RemoteApp; the
      # name matches the CR name (CONTEXT.md "canonicalLabels").
      - service_account: "smoke:smoke-app"
---
kind: token
version: v2
metadata:
  name: tunnelport-trust-bundle-token
spec:
  roles:
    - Bot
  bot_name: tunnelport-trust-bundle-bot
  join_method: kubernetes
  kubernetes:
    type: static_jwks
    static_jwks:
      # Same shape as smoke-bot-token above — substituted at
      # smoke-time with the consumer kind cluster's
      # `/openid/v1/jwks` document. The JWKS is shared (both bots
      # run on the same kind cluster); the `allow` rule below is
      # the per-token narrowing.
      jwks: |
        REPLACE_WITH_CONSUMER_JWKS
    allow:
      # The chart's singleton trust-bundle bot SA, materialised by
      # helm/tunnelport/templates/trust-bundle-serviceaccount.yaml in
      # `installNamespace`. Format: `<namespace>:<sa-name>`.
      - service_account: "tunnelport-system:tunnelport-trust-bundle"
