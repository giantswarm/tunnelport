version: 2.1

orbs:
  architect: giantswarm/architect@4.24.0

workflows:
  build:
    jobs:
      - architect/go-build:
          name: go-build
          binary: tunnelport
          filters:
            tags:
              only: /^v.*/

      - architect/push-to-docker:
          context: "architect"
          name: push-tunnelport-to-docker
          image: "docker.io/giantswarm/tunnelport"
          username_envar: "DOCKER_USERNAME"
          password_envar: "DOCKER_PASSWORD"
          requires:
            - go-build
          # Needed to trigger job also on git tag.
          filters:
            tags:
              only: /^v.*/

      - architect/push-to-docker:
          context: "architect"
          name: push-tunnelport-to-quay
          image: "quay.io/giantswarm/tunnelport"
          username_envar: "QUAY_USERNAME"
          password_envar: "QUAY_PASSWORD"
          requires:
            - go-build
          # Needed to trigger job also on git tag.
          filters:
            tags:
              only: /^v.*/

      - architect/push-to-docker:
          context: "architect"
          name: push-tunnelport-to-aliyun
          image: "giantswarm-registry.cn-shanghai.cr.aliyuncs.com/giantswarm/tunnelport"
          username_envar: "ALIYUN_USERNAME"
          password_envar: "ALIYUN_PASSWORD"
          requires:
            - go-build
          # Needed to trigger job also on git tag.
          filters:
            tags:
              only: /^v.*/


      - architect/push-to-app-catalog:
          context: "architect"
          name: push-tunnelport-to-app-catalog
          app_catalog: "control-plane-catalog"
          app_catalog_test: "control-plane-test-catalog"
          chart: "tunnelport"
          requires:
            - push-tunnelport-to-docker
            - push-tunnelport-to-quay
          # Needed to trigger job also on git tag.
          filters:
            tags:
              only: /^v.*/
