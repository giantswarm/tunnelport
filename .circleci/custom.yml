# Repo-owned CircleCI extension. The setup workflow in config.yml deep-merges
# this file into the generated workflows.yml at pipeline runtime: maps merge,
# workflow job lists append. Jobs here may reference generated jobs by their
# bare names (e.g. requires: [go-build]). Changes take effect on the PR that
# makes them; devctl and align-files never touch this file.

# End-to-end smoke. Spins up three local kind clusters (teleport / producer /
# consumer), runs the operator against a real Teleport, and asserts a curl pod
# in the consumer reaches a sample app in the producer via the
# operator-rendered tbot tunnel.
#
# Self-contained on purpose: no external Teleport tenant, no CI secrets to
# manage. This job is the e2e signal on PRs and gates merges as a GitHub
# required check.
jobs:
  # Chart checks, in two parts:
  #
  #   * test/helm/chart_test.sh -- rendering assertions: RBAC shape, value
  #     flow, CRD gating, the team label, the tenant label, and that the
  #     PodMonitor and the verification wiring actually render.
  #   * helm/tunnelport/tests/run.sh -- promtool unit tests for the
  #     PrometheusRule. Rendering tests cannot tell you whether an alert
  #     fires when it should or stays quiet when it should, which for the
  #     TLS-verification rules is the entire question.
  #
  # Runs in a plain container rather than the architect executor or the e2e
  # machine executor: the dependencies are helm, promtool and yq, none of
  # which the architect Go image carries, and none of which need Docker.
  # `make test` therefore cannot reach the promtool suite -- hence this job.
  # Versions are pinned so an upstream release cannot turn CI red on an
  # unrelated PR.
  chart-test:
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      HELM_VERSION: v3.16.0
      PROMETHEUS_VERSION: 3.6.0
      YQ_VERSION: v4.44.6
    steps:
      - checkout
      - run:
          name: Install helm, promtool and yq
          command: |
            set -euxo pipefail
            curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
            sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
            curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar -xz -C /tmp
            sudo install -m 0755 "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
            # mikefarah/yq -- cimg/base ships no yq, and the python jq
            # wrapper of the same name does not understand `yq eval`.
            sudo curl -sSLo /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
            sudo chmod 0755 /usr/local/bin/yq
            helm version --short && promtool --version && yq --version
      - run:
          name: Run chart assertions
          command: bash test/helm/chart_test.sh
      - run:
          name: Run PrometheusRule promtool tests
          command: bash helm/tunnelport/tests/run.sh

  e2e-smoke:
    machine:
      # Latest Ubuntu LTS image with Docker preinstalled. kind needs
      # real Docker, not a remote-docker shim.
      image: ubuntu-2404:current
      resource_class: large
    environment:
      KIND_VERSION: v0.31.0
      KUBECTL_VERSION: v1.31.0
      HELM_VERSION: v3.16.0
    steps:
      - checkout
      - run:
          name: Install kind, kubectl, helm, jq
          command: |
            set -euxo pipefail
            curl -sSLo /tmp/kind https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64
            sudo install -m 0755 /tmp/kind /usr/local/bin/kind
            curl -sSLo /tmp/kubectl https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
            curl -sSL https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz | tar -xz -C /tmp
            sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
            # jq ships with the ubuntu-2404 machine image. The former
            # unconditional `apt-get update` hung with no output until the
            # 10-minute step timeout in 6 of the 12 e2e-smoke runs between
            # 2026-09-04 and 2026-09-05 (jobs 2221, 2227, 2235, 2246, 2285,
            # 2287) -- the only way this job failed in that window. Touch apt
            # only if jq is really missing.
            if ! command -v jq >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq jq
            fi
            kind version && kubectl version --client && helm version --short && jq --version
      - run:
          name: Run end-to-end smoke
          # Wall-clock target: under 10 min. Match the run.sh script's
          # internal timeouts so a stuck step fails the job, rather
          # than CircleCI's outer no-output-timeout.
          no_output_timeout: 12m
          command: bash hack/smoke/run.sh

workflows:
  build:
    jobs:
      # Unit + envtest suite. The golden go-build no longer runs a make test
      # target (the orb's test_target defaults to empty), so tunnelport's tests
      # run here as a repo-owned job. test-ci provisions controller-runtime
      # envtest binaries and runs `go test ./...`.
      - architect/go-test:
          name: go-test
          context: architect
          test_target: test-ci
          filters:
            tags:
              only: /^v.*/

      - chart-test:
          name: chart-test
          filters:
            tags:
              only: /^v.*/

      - e2e-smoke:
          name: e2e-smoke
          requires:
            - go-build
          filters:
            tags:
              only: /^v.*/
