{{- if .Values.trustBundle.enabled }}
# Pre-created (empty Data) trust-bundle Secret. The singleton tbot's
# `kubernetes_secret` destination requires an existing target on first
# write; pre-creating it from the chart keeps the first reconcile loop
# free of "Secret not found" retries.
#
# `helm.sh/resource-policy: keep` prevents `helm uninstall` from deleting
# the Secret along with the chart. Consumers in this namespace continue
# verifying SVIDs against the cached bundle even if the chart is removed
# — operationally important for clean uninstalls during chart upgrades
# that move the bot to a new release name.
#
# Data is intentionally absent: tbot owns `svid_bundle.pem` once it
# starts running. The Secret type is Opaque (not TLS) because the
# bundle is a public PEM-encoded artefact, not a key+cert pair.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.trustBundle.secretName }}
  namespace: {{ .Values.installNamespace }}
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- end }}
