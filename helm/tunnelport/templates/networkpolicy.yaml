{{- if .Values.networkPolicy.enabled -}}
# NetworkPolicy for the operator's *own* manager pod. Per GS convention
# for kubebuilder operators: default-deny with explicit allow rules for
# kube-apiserver egress (so the controller can talk to the API) and
# metrics ingress (so Prometheus can scrape).
#
# This NetworkPolicy is operator hygiene only. The chart deliberately
# does NOT render a NetworkPolicy for the *rendered tbot pods* — those
# are tenant resources and platform teams own that policy. See
# README.md "NetworkPolicy responsibilities" for the canonical labels
# their hand-written policy should target.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tunnelport.fullname" . }}
  namespace: {{ .Values.installNamespace }}
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
spec:
  # Manager pod only. The selector labels alone would ALSO match the
  # chart-managed singleton trust-bundle tbot (ADR 0008), whose pod
  # carries the same app.kubernetes.io/{name,instance} pair plus a
  # role label — and that bot must dial the Teleport proxy on an
  # arbitrary host:port (a NodePort in the e2e smoke, so outside the
  # DNS/443/6443 the egress rules allow), which
  # this policy's egress rules would deny. Excluding role-labeled pods
  # (same exclusion as the PodDisruptionBudget) keeps this policy
  # scoped to the manager; the trust-bundle bot's policy is the
  # platform team's, like the rendered tbots' (see README.md).
  # Root cause of the flaky e2e-smoke i/o timeouts (#41): kind ≥ v0.24
  # enforces NetworkPolicy via kube-network-policies, fail-open — so
  # the trust-bundle bot was blocked from joining whenever enforcement
  # was active.
  podSelector:
    matchLabels:
      {{- include "tunnelport.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: tunnelport.giantswarm.io/role
        operator: DoesNotExist
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow Prometheus to scrape :{{ .Values.ports.metrics }} and the
  # health probes on :{{ .Values.ports.health }}. Caller selector is
  # left wide-open here because Prometheus deployments vary across MCs;
  # tighten with a values overlay in clusters that ship a stable
  # monitoring namespace. This rule is what bounds the exposure of the
  # plain-HTTP metrics endpoint (`--metrics-secure=false`, see
  # deployment.yaml) — it is reachable from inside the cluster only.
  - ports:
    - port: {{ .Values.ports.metrics }}
      protocol: TCP
    - port: {{ .Values.ports.health }}
      protocol: TCP
  egress:
  # DNS — needed to resolve the kube-apiserver ClusterIP and any
  # external addresses the manager is configured to reach.
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # Kube-apiserver. No `to:` peer is set deliberately: with `to:
  # ipBlock`, Cilium (GS's primary CNI) does not match traffic
  # destined for the in-cluster `kubernetes` Service VIP or the
  # apiserver pod IPs — only off-cluster destinations — so the
  # operator can't reach kube-API at all. An empty peer set means
  # "any destination on these ports", which is the right default for
  # an operator that only ever talks to the apiserver on 443/6443.
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
{{- if and .Values.verification.enabled .Values.trustBundle.enabled }}
  # The tunnel TLS port, for the verification dial. Without this rule the
  # probe reaches no RemoteApp Service at all and every tunnel reports
  # `unreachable` — a whole-fleet false alarm produced by this policy
  # rather than by the tunnels, which is exactly how #41 presented for
  # the trust-bundle bot.
  #
  # No `to:` peer, for the same reason as the kube-apiserver rule above
  # and deliberately rather than for brevity: the dial targets a
  # ClusterIP Service VIP, and CNIs disagree about whether egress peers
  # are matched before or after the service translation. A
  # `podSelector: {tunnelport.giantswarm.io/role: tbot}` peer would be
  # tighter and would silently deny every probe on any implementation
  # that evaluates the pre-DNAT destination. An empty peer set means
  # "any destination on this port", which for a pod whose only outbound
  # traffic is the apiserver and its own tunnels is a narrow grant.
  - ports:
    - port: {{ .Values.tls.port }}
      protocol: TCP
{{- end }}
{{- end }}
