apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tunnelport.fullname" . }}-manager
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
rules:
# RemoteApp itself — read-only at the spec level. The reconciler updates
# only the status subresource. We do not run finalizer logic of our
# own, but the rendered children carry OwnerReferences with
# `BlockOwnerDeletion: true` (controller-runtime's
# SetControllerReference default — see render.go:setOwnerRef), and the
# API server requires `update` on the owner's `finalizers` subresource
# for that field to be settable.
- apiGroups:
  - access.giantswarm.io
  resources:
  - remoteapps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - access.giantswarm.io
  resources:
  - remoteapps/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - access.giantswarm.io
  resources:
  - remoteapps/finalizers
  verbs:
  - update

# Per-CR ServiceAccount — the operator renders one ServiceAccount per
# RemoteApp (ADR 0004 kubernetes-join model). The SA's projected JWT is
# the subject the Teleport ProvisionToken's `allow` rule pins.
# Operator uses Server-Side Apply (`client.Apply`), so `update` is not
# needed (SSA goes through `patch`); `delete` is also not needed because
# the ServiceAccount is GC'd via OwnerReferences when the CR is deleted.
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
  - create
  - patch

# Pod metadata — read-only. Slice 4's status loop derives
# `status.lastError` from pod Phase / ContainerStatuses / RestartCount /
# last termination reason and watches Pods labelled with the canonical
# `tunnelport.giantswarm.io/remoteapp` label so status refreshes on pod
# events. ADR 0003 forbids `pods/log`; we deliberately do not list it.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch

# Owned objects rendered in the CR's namespace. The operator reconciles
# RemoteApps cluster-wide, so these have to be cluster-scoped via the
# ClusterRole — but the operator only ever writes them in the namespace
# of the CR being reconciled.
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# Trust-bundle distribution (slice 03 / ADR 0007 §"Trust bundle
# distribution to consumers"). The operator pre-creates a per-CR
# `<cr.Name>-spiffe-bundle` Secret (owned by the RemoteApp, empty Data)
# and a per-CR Role + RoleBinding that ties the per-CR ServiceAccount to
# `get;update;patch` on that single named Secret. tbot then writes
# `svid_bundle.pem` via its `kubernetes_secret` destination. The
# operator-level ClusterRole is broad because controller-runtime's
# typed client doesn't pre-filter writes; the *effective* in-cluster
# authority handed to tbot pods is the per-CR Role, which carries a
# `resourceNames: [<name>-spiffe-bundle]` constraint — see
# render.go::renderTrustBundleRole.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# Leader-election: leases in the operator's own namespace. controller-
# runtime defaults to a `coordination.k8s.io/leases` lock; the
# Deployment template below sets --leader-elect=true.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

# Events: the operator emits Kubernetes Events alongside status
# conditions (slice 4 wires this up; the verb is harmless before then).
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

# DELIBERATELY NOT GRANTED, per ADR 0003 / ADR 0004:
#   * `pods/log`               — the operator never reads container logs;
#                                status surfaces k8s-visible state only.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tunnelport.fullname" . }}-manager
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tunnelport.fullname" . }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "tunnelport.fullname" . }}
  namespace: {{ .Values.installNamespace }}
---
# Metrics-reader ClusterRole — bound to the Prometheus ServiceAccount on
# each consumer MC out-of-band (one decision per cluster). Defining the
# ClusterRole inline keeps the metrics endpoint usable without forcing
# every chart consumer to copy-paste the verb list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tunnelport.fullname" . }}-metrics-reader
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
