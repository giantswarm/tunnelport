apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tunnelport.fullname" . }}-manager
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
rules:
# RemoteApp itself — read-only at the spec level. The reconciler updates
# only the status subresource. We do not run finalizer logic of our
# own, but the rendered children carry OwnerReferences with
# `BlockOwnerDeletion: true` (controller-runtime's
# SetControllerReference default — see render.go:setOwnerRef), and the
# API server requires `update` on the owner's `finalizers` subresource
# for that field to be settable.
- apiGroups:
  - access.giantswarm.io
  resources:
  - remoteapps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - access.giantswarm.io
  resources:
  - remoteapps/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - access.giantswarm.io
  resources:
  - remoteapps/finalizers
  verbs:
  - update

# Per-CR ServiceAccount — the operator renders one ServiceAccount per
# RemoteApp (ADR 0004 kubernetes-join model). The SA's projected JWT is
# the subject the Teleport ProvisionToken's `allow` rule pins.
# Operator uses Server-Side Apply (`client.Apply`), so `update` is not
# needed (SSA goes through `patch`); `delete` is also not needed because
# the ServiceAccount is GC'd via OwnerReferences when the CR is deleted.
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
  - create
  - patch

# Pod metadata — read-only. Slice 4's status loop derives
# `status.lastError` from pod Phase / ContainerStatuses / RestartCount /
# last termination reason and watches Pods labelled with the canonical
# `tunnelport.giantswarm.io/remoteapp` label so status refreshes on pod
# events. ADR 0003 forbids `pods/log`; we deliberately do not list it.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch

# Secret access is NOT granted here. The trust-bundle reloader reads only
# the single trust-bundle Secret in the install namespace, so that grant
# is a namespace-scoped Role (see the `-trust-bundle-reader` Role below),
# never a cluster-wide ClusterRole grant. The operator holds no cluster-
# wide Secret read and never writes any Secret (ADR 0004 / CONTEXT.md).

# Owned objects rendered in the CR's namespace. The operator reconciles
# RemoteApps cluster-wide, so these have to be cluster-scoped via the
# ClusterRole — but the operator only ever writes them in the namespace
# of the CR being reconciled.
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# ADR 0008 removed the per-CR trust-bundle Secret/Role/RoleBinding;
# the operator no longer *renders* any Secret, Role, or RoleBinding, so
# the `rbac.authorization.k8s.io/roles,rolebindings` write grants that
# ADR 0007 added here stay removed. Consumer trust-bundle distribution is
# the chart-managed singleton tbot's job (see `trust-bundle-*.yaml`
# templates). The reloader's *read-only* `core/secrets` grant is a
# namespace-scoped Role (below), never a ClusterRole grant — never a
# write verb, never cluster-wide.

# Leader-election: leases in the operator's own namespace. controller-
# runtime defaults to a `coordination.k8s.io/leases` lock; the
# Deployment template below sets --leader-elect=true.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

# Events: the operator emits Kubernetes Events alongside status
# conditions (slice 4 wires this up; the verb is harmless before then).
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

# DELIBERATELY NOT GRANTED, per ADR 0003 / ADR 0004:
#   * `pods/log`               — the operator never reads container logs;
#                                status surfaces k8s-visible state only.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tunnelport.fullname" . }}-manager
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tunnelport.fullname" . }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "tunnelport.fullname" . }}
  namespace: {{ .Values.installNamespace }}
{{- if .Values.trustBundle.enabled }}
---
# Trust-bundle reader — namespace-scoped read-only Secret access for the
# trust-bundle reloader. The reloader reads exactly one Secret
# (`trustBundle.secretName`) in the install namespace to hash its
# `svid_bundle.pem` and roll opted-in consumer Deployments; scoping this
# to a Role (not the manager ClusterRole) keeps the operator off any
# cluster-wide Secret read. Rendered only when trustBundle.enabled, matching
# the reloader flags in the Deployment template.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tunnelport.fullname" . }}-trust-bundle-reader
  namespace: {{ .Values.installNamespace }}
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tunnelport.fullname" . }}-trust-bundle-reader
  namespace: {{ .Values.installNamespace }}
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tunnelport.fullname" . }}-trust-bundle-reader
subjects:
- kind: ServiceAccount
  name: {{ include "tunnelport.fullname" . }}
  namespace: {{ .Values.installNamespace }}
{{- end }}
---
# Metrics-reader ClusterRole — bound to the Prometheus ServiceAccount on
# each consumer MC out-of-band (one decision per cluster). Defining the
# ClusterRole inline keeps the metrics endpoint usable without forcing
# every chart consumer to copy-paste the verb list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tunnelport.fullname" . }}-metrics-reader
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
