{{- if .Values.trustBundle.enabled }}
# ServiceAccount for the singleton trust-bundle tbot (ADR 0008). The
# Teleport-central ProvisionToken's `static_jwks.allow` rule pins this
# SA name, so a leaked bot pod can only join *this* token.
#
# Named `<release>-trust-bundle` (NOT `tunnelport.fullname`) so it stays
# distinct from the operator's own ServiceAccount that the chart's
# rbac.yaml binds the manager ClusterRole to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tunnelport.fullname" . }}-trust-bundle
  namespace: {{ .Values.installNamespace }}
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
    tunnelport.giantswarm.io/role: trust-bundle-bot
{{- end }}
