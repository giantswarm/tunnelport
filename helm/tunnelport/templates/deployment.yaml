apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tunnelport.fullname" . }}
  namespace: {{ .Values.installNamespace }}
  labels:
    {{- include "tunnelport.labels" . | nindent 4 }}
spec:
  # HA via leader election. controller-runtime's leader-election keeps
  # exactly one replica reconciling at a time, while a hot standby
  # absorbs node drains, chart upgrades, and pod evictions without a
  # window where reconciles stop. RollingUpdate (default) brings up the
  # new replica before tearing down the old, so leader-handoff is
  # bounded by the lease's renewal cadence rather than by pod startup.
  # Tunable via .Values.replicaCount; the chart-default is 2 because
  # token-rotation reconciles must not pause for chart-upgrade windows.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tunnelport.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tunnelport.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tunnelport.fullname" . }}
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
      - name: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: manager
        image: {{ include "tunnelport.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # POD_NAMESPACE is consumed by main.go to scope the
        # leader-election Lease to this Deployment's own namespace.
        # Injected via the downward API so the binary doesn't need a
        # filesystem-mounted ServiceAccount token to discover it.
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The `--tbot-*` flags are how Helm values flow into every tbot
        # Deployment the operator renders. The reconciler reads them once
        # at startup (main.go) and stamps them onto every tbot
        # Deployment. There is deliberately no per-RemoteApp override.
        #
        # `--teleport-cluster-name` / `--teleport-proxy-addr` (ADR 0005)
        # are operator-level Teleport binding; both required at chart
        # install via values.schema.json. An empty value fails fast at
        # operator startup.
        args:
        - --leader-elect=true
        - --health-probe-bind-address=:{{ .Values.ports.health }}
        - --metrics-bind-address=:{{ .Values.ports.metrics }}
        # Plain HTTP on the metrics port. controller-runtime's secure
        # variant gates /metrics behind TokenReview+SubjectAccessReview,
        # which requires granting the scraping agent's ServiceAccount a
        # `nonResourceURLs: ["/metrics"]` ClusterRole in every
        # installation — a cross-repo change per MC, and the reason
        # tunnelport's metrics were served but never scraped. The GS
        # convention for operator metrics is plain HTTP bounded by the
        # NetworkPolicy below; nothing on this endpoint is a credential.
        - --metrics-secure=false
{{- if and .Values.verification.enabled .Values.trustBundle.enabled }}
        # Active TLS verification (giantswarm/giantswarm#37521 gap 2).
        # Gated on trustBundle too: the bundle the manager verifies
        # against is the singleton bot's Secret, so without that bot
        # there is nothing to verify against and the operator would only
        # be able to report "I cannot tell".
        - --verify-tunnels=true
        - --verify-trust-bundle-file={{ include "tunnelport.trustBundleMountPath" . }}/svid_bundle.pem
        - --verify-interval={{ .Values.verification.interval }}
        - --verify-timeout={{ .Values.verification.timeout }}
        - --verify-concurrency={{ .Values.verification.concurrency }}
        - --cluster-domain={{ .Values.verification.clusterDomain }}
{{- else }}
        - --verify-tunnels=false
{{- end }}
        - --tbot-image={{ include "tunnelport.tbotImage" . }}
        - --tbot-cpu-request={{ .Values.tbot.resources.requests.cpu }}
        - --tbot-memory-request={{ .Values.tbot.resources.requests.memory }}
        - --tbot-cpu-limit={{ .Values.tbot.resources.limits.cpu }}
        - --tbot-memory-limit={{ .Values.tbot.resources.limits.memory }}
        - --ghostunnel-image={{ include "tunnelport.ghostunnelImage" . }}
        - --ghostunnel-reload-interval={{ .Values.tls.reloadInterval }}
        - --ghostunnel-listen-port={{ .Values.tls.port }}
        - --teleport-cluster-name={{ required "teleport.clusterName is required (ADR 0005)" .Values.teleport.clusterName }}
        - --teleport-proxy-addr={{ required "teleport.proxyAddr is required (ADR 0005)" .Values.teleport.proxyAddr }}
        {{- if .Values.tbot.insecure }}
        - --tbot-insecure=true
        {{- end }}
        ports:
        - name: metrics
          containerPort: {{ .Values.ports.metrics }}
          protocol: TCP
        - name: health
          containerPort: {{ .Values.ports.health }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
{{- if and .Values.verification.enabled .Values.trustBundle.enabled }}
        volumeMounts:
        # The SPIFFE trust bundle the verification dial checks served
        # chains against. Mounted as a file rather than read through the
        # API server on purpose: the operator's ClusterRole grants no
        # verbs on secrets (ADR 0008) and this keeps it that way — the
        # kubelet does the reading. `optional` is not set, but the chart
        # pre-creates the Secret with empty Data, so the pod starts
        # before tbot has written anything; an empty or absent
        # svid_bundle.pem reports
        # tunnelport_tls_verification_available 0 rather than failing
        # every tunnel.
        - name: trust-bundle
          mountPath: {{ include "tunnelport.trustBundleMountPath" . }}
          readOnly: true
{{- end }}
      {{- if and .Values.verification.enabled .Values.trustBundle.enabled }}
      volumes:
      - name: trust-bundle
        secret:
          secretName: {{ .Values.trustBundle.secretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Pod anti-affinity: prefer different nodes for the operator
      # replicas so a single node failure can't take both down. Soft
      # (preferred) rather than required so single-node clusters
      # (kind/dev) can still schedule both replicas. Override the
      # whole block with .Values.affinity to opt out or tighten.
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- include "tunnelport.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
        {{- end }}
