apiVersion: v2
name: tunnelport
description: |
  tunnelport — Giant Swarm operator that wraps a Teleport tbot
  application-tunnel + a Kubernetes Service behind a single `RemoteApp` CR,
  so workloads on a consumer management cluster can reach a
  Teleport-exposed app as if it were a local Service.
type: application
home: https://github.com/giantswarm/tunnelport
icon: https://s.giantswarm.io/app-icons/giantswarm/1/light.svg
sources:
  - https://github.com/giantswarm/tunnelport
# `version` is rewritten by app-build-suite from the git tag at release
# time; the image tag is resolved from it (see `tunnelport.image` in
# templates/_helpers.tpl). `appVersion` is NOT stamped by the pinned
# release orb and is kept as a `0.0.0` placeholder only so the unreleased
# chart still installs cleanly with `helm install`.
version: 1.0.2
appVersion: 0.0.0
annotations:
  application.giantswarm.io/team: bumblebee
