# Namespace the operator is installed into. The chart does not create
# this namespace — `helm install --create-namespace` does, or your
# GitOps tooling does. Leaving this configurable is harmless; the
# operator-rendered resources live in the *RemoteApp's* namespace, not
# this one.
installNamespace: tunnelport-system

# Replica count for the operator Deployment. controller-runtime
# leader election keeps exactly one replica reconciling; the second
# is a hot standby that absorbs node drains and chart upgrades
# without a reconcile gap. Set to 1 only if cluster scheduling
# pressure forces it; pair with podDisruptionBudget.enabled=false
# in that case so a drain isn't blocked.
replicaCount: 2

# PodDisruptionBudget for the operator. minAvailable: 1 lets one
# replica be evicted at a time while keeping a leader-electable
# replica online. Disable when replicaCount: 1.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # AlwaysAllow ensures a node drain can evict an unhealthy (NotReady)
  # operator pod even if the PDB is at the disruption budget — required
  # to prevent a crashlooping replica from blocking drains.
  unhealthyPodEvictionPolicy: AlwaysAllow

# Operator container image. `tag` falls back to .Chart.Version (which
# app-build-suite stamps from the git tag at release time, matching the
# image tag the pipeline pushes). Leave empty to track the chart version.
image:
  registry: gsoci.azurecr.io
  name: giantswarm/tunnelport
  tag: ""
  pullPolicy: IfNotPresent

# The cluster-managed pull secret for `gsoci.azurecr.io`. The chart
# references this Secret by name on the manager pod template; the
# Secret itself is provisioned out-of-band (cluster-scoped concern,
# not the operator's). Set to "" to skip the imagePullSecrets entry.
imagePullSecret: gsoci-pull-secret

# Operator resource requests/limits. Modest defaults — the operator does
# nothing per-Reconcile except CRUD three small objects.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Teleport binding for this consumer MC. Both fields are REQUIRED at
# install — templates/deployment.yaml uses the helm `required` function
# to fail `helm install` with a directional error if either is missing
# (ADR 0005). Every RemoteApp on this MC binds to the cluster and proxy
# named here; multi-Teleport-cluster on a single consumer MC needs a
# second operator install in its own namespace.
#
# The empty-string defaults let `ct lint` accept the chart's own
# values.yaml — `helm install` without `-f`/`--set` still fails fast
# at template render time via the `required` helm function (with a
# clearer message than a JSON Schema violation). The keys must exist
# here (not a bare `teleport: {}`) so the generated values.schema.json
# knows them — the schema sets additionalProperties: false. Fill them
# in your values overlay or pass via `--set`.
teleport:
  # -- Teleport cluster name (the `Cluster:` line from `tctl status` on
  # Central). Used as the `aud` claim on every rendered tbot pod's
  # projected ServiceAccount JWT — Teleport's `static_jwks` validator
  # pins JWT `aud` to this exact value. DNS-1123 subdomain shape,
  # e.g. teleport.example.com. Required at install time (ADR 0005).
  clusterName: ""
  # -- host:port of the Teleport proxy every rendered tbot pod connects
  # to, e.g. teleport.example.com:443. Flows into `proxy_server` in the
  # rendered tbot.yaml. Required at install time (ADR 0005).
  proxyAddr: ""

# Per-tbot-Deployment defaults. These flow into the operator manager's
# CLI flags (`--tbot-image`, `--tbot-cpu-request`, etc.) which the
# operator stamps onto every tbot Deployment it renders. They are
# cluster-wide defaults — RemoteApp.spec deliberately does not let CR
# authors override them.
tbot:
  # `tbot-distroless` (NOT `teleport-distroless`): the latter has
  # `teleport` as ENTRYPOINT and rejects `start -c …` with "unexpected
  # start" — see the renderer comment at
  # internal/controller/remoteapp/render.go where Command: ["tbot"] is
  # set explicitly.
  #
  # Sourced from gsoci (`gsoci.azurecr.io/giantswarm/tbot-distroless`, a
  # mirror of `public.ecr.aws/gravitational/tbot-distroless`) so the
  # rendered pods satisfy the `restrict-image-registries` Kyverno policy.
  # Override `registry` to pull from a different mirror.
  #
  # Pinned to the v18 line to track GS's Teleport server (v18.7+) — the
  # `GenerateUserCerts` RPC contract changed across the v16→v18 jump
  # and a mismatched-major tbot fails renewal with `ssh: no key found`.
  # Pinned by digest so a re-push behind the floating `:18` tag cannot
  # silently change tbot's config schema underneath us (see the
  # listen/listener field rename noted at internal/controller/remoteapp/render.go).
  # The digest is preserved across the gsoci mirror (skopeo copies the
  # manifest verbatim). Resolve a fresh digest before each chart release with:
  #   crane digest gsoci.azurecr.io/giantswarm/tbot-distroless:18
  image:
    registry: gsoci.azurecr.io
    name: giantswarm/tbot-distroless
    tag: "18"
    digest: sha256:0d94fd0d9910f32f76914d4a5699b7b89b23e211de39298fc1b4305c8c153755
  # Development-only: render tbot configs with `insecure: true` so the
  # pods skip Teleport proxy TLS verification. Useful for kind-based
  # smoke tests where the proxy is reached by IP and the cert SAN does
  # not match. NEVER enable this in production.
  insecure: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Ghostunnel TLS-termination sidecar (ADR 0007 / slice 02). Every
# rendered tbot Deployment grows a ghostunnel sidecar that reads the
# SVID tbot writes into a shared emptyDir and serves it on the
# rendered Service's `tls` port. These values flow into the operator
# manager's CLI flags (`--ghostunnel-image`, etc.).
tls:
  # Pinned ghostunnel release; bump deliberately. Sourced from gsoci
  # (`gsoci.azurecr.io/giantswarm/ghostunnel`, a mirror of the upstream
  # `ghostunnel/ghostunnel` Docker Hub image) so the rendered sidecar
  # satisfies the `restrict-image-registries` Kyverno policy. Override
  # `registry` to pull from a different mirror. Digest-pinned and
  # preserved across the mirror (skopeo copies the manifest verbatim).
  image:
    registry: gsoci.azurecr.io
    name: giantswarm/ghostunnel
    tag: v1.10.0
    digest: sha256:ab209cc0c8eb7020a826ea8052aade2b77d7d9ce3724fab7ec34aba5cdf2e153
  # Polling interval ghostunnel uses to re-read the SVID files from
  # disk. Safe at 5m because tbot's workload-identity-x509 service
  # renews every 20m by default — see ADR 0007 §"Migration shape".
  reloadInterval: 5m
  # TLS port the rendered Service exposes (and the ghostunnel sidecar
  # listens on inside the pod). The plaintext port name `tbot` is
  # preserved for selector / NetworkPolicy backward compatibility.
  port: 8443

# CRD packaging. With `crds.install: true` (the default) the chart
# bundles the CRD inline in `templates/crds.yml` with
# `helm.sh/resource-policy: keep`, so `helm uninstall` does NOT delete
# the CRD (and the RemoteApp instances it admits). Set to `false` if
# the CRD is managed out-of-band — e.g. by a cluster-bootstrap chart.
crds:
  install: true

# NetworkPolicy for the operator's own manager pod (not for the rendered
# tbot pods — those are tenant resources, see README). Per GS convention
# for kubebuilder operators: default-deny with explicit allow rules for
# kube-apiserver egress and metrics ingress. The kube-API egress rule
# uses no `to:` peer because Cilium does not match traffic to the
# in-cluster `kubernetes` Service VIP under `to: ipBlock`.
networkPolicy:
  enabled: true

# Active TLS verification of the tunnels the operator renders
# (giantswarm/giantswarm#37521 gap 2).
#
# On the interval below, the operator dials every RemoteApp that reports
# `status.ready: true` at `<name>.<namespace>.svc.<clusterDomain>:<tls.port>`
# with `ServerName` set to that FQDN, and verifies the served chain against
# the SPIFFE trust bundle. The outcome becomes the
# `tunnelport_remoteapp_tls_verification` metric and the `TunnelVerified`
# condition on the CR.
#
# Why this exists: nothing else the operator watches can see a certificate
# whose SANs stopped matching the Service name. tbot joins, the SVID is
# issued, ghostunnel binds :8443, and the sidecar's readiness probe is a
# bare TCP connect — a wrong-SAN certificate passes all of it. 40 tunnels
# served unverifiable certificates for ~2 days with every signal green.
#
# Requires `trustBundle.enabled` (the singleton bot's Secret is what the
# manager pod mounts and verifies against). With trustBundle disabled the
# manager has nothing to verify against and the check turns itself off.
verification:
  enabled: true
  # Probe cadence, and therefore the worst-case detection latency. Keep it
  # well under the alerts' `for: 20m` window so a sustained failure is
  # sampled many times before it pages, and under tbot's 20m SVID renewal
  # so a bad renewal is caught within one cycle.
  interval: 2m
  # Budget for one RemoteApp's dial plus handshake.
  timeout: 5s
  # How many RemoteApps are probed at once. A round costs at most
  # ceil(N/concurrency) * timeout, which must stay under `interval`: the
  # default covers ~2800 RemoteApps, far past any real consumer MC.
  concurrency: 8
  # The cluster's DNS domain, completing the FQDN the probe dials and pins
  # as ServerName. Change only on clusters installed with a non-default
  # `--cluster-domain` on kubelet/CoreDNS.
  clusterDomain: cluster.local

# Monitoring wiring: the PodMonitor that scrapes the manager's /metrics,
# and the PrometheusRule carrying the alerts.
monitoring:
  # PodMonitor for the manager pods. Without it the operator's metrics —
  # including tunnelport_remoteapp_tls_verification — are served and never
  # collected, which is the same as not having them. Pod-level rather than
  # Service-level because the chart renders no Service for the manager and
  # the metrics endpoint is the only thing worth scraping on it.
  #
  # Disable on installs whose monitoring stack does not reconcile
  # PodMonitors; the metrics stay available on the pod's metrics port for
  # anything else to scrape.
  podMonitor:
    enabled: true
    interval: 60s
    scrapeTimeout: 30s
    # Labels for the PodMonitor resource, merged over the chart's common
    # labels. On Giant Swarm installations the monitoring agent selects
    # PodMonitors by a label on the PodMonitor *object*, with two
    # alternatives (verified against alloy-metrics' rendered config on a
    # live MC):
    #
    #   observability.giantswarm.io/tenant In [<tenant>]      -- current
    #   application.giantswarm.io/team Exists                 -- "legacy",
    #     and only when observability.giantswarm.io/tenant is absent
    #
    # The chart's common labels already carry the team label, so the
    # PodMonitor would be discovered either way today — but via the path
    # the agent's own config calls legacy. Setting the tenant explicitly
    # puts it on the supported selector and makes the tenant a decision
    # rather than a fallback. Same value, same reason, as
    # prometheusRule.labels below; a PodMonitor matching neither selector
    # is created and silently never scraped.
    labels:  # @schema additionalProperties: true;skipProperties: true
      observability.giantswarm.io/tenant: giantswarm

  # PrometheusRule with alerts for the tunnelport data plane: a tunnel pod
  # (tbot/ghostunnel) stuck in CrashLoopBackOff, the operator having no
  # available replicas, a tunnel serving a certificate callers cannot
  # verify, a Ready tunnel that accepts no connections, and the
  # verification itself being unable to run. Rendered into installNamespace
  # but the expressions select tunnel pods cluster-wide. Disable on installs
  # whose MC monitoring stack does not pick up in-namespace PrometheusRules.
  prometheusRule:
    enabled: true
    # Labels for the PrometheusRule resource, merged over the chart's common
    # labels. On Giant Swarm installations this must carry
    # observability.giantswarm.io/tenant, which Mimir's rule_selector matches on;
    # a rule without it is never loaded into the ruler.
    labels:  # @schema additionalProperties: true;skipProperties: true
      observability.giantswarm.io/tenant: giantswarm

# Ports the manager listens on. Exposed here only so `networkPolicy` and
# the PodMonitor stay in sync with the actual flag values.
#
# The metrics port serves plain HTTP (`--metrics-secure=false`), which is
# the Giant Swarm convention for operator metrics: the authn/authz variant
# needs the scraping agent's ServiceAccount to hold a `nonResourceURLs:
# /metrics` grant, which is a cross-repo change per installation, and the
# exposure is bounded by the NetworkPolicy instead. What is served is
# controller-runtime's own instrumentation plus RemoteApp names,
# namespaces and verification outcomes — no credentials, no Secret content.
ports:
  metrics: 8080
  health: 8081

# Pod-level securityContext. Defaults match the GS operator convention.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext. Distroless + readOnlyRootFilesystem.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}

# Singleton trust-bundle tbot (ADR 0008). One chart-managed tbot
# Deployment in `installNamespace` writes the SPIFFE trust bundle into a
# single Kubernetes Secret. Consumers (muster, etc.) co-deployed in this
# same namespace mount that Secret and use `svid_bundle.pem` as the CA
# bundle for verifying tunnel SVIDs from any RemoteApp on the cluster.
# Per-RemoteApp tbots no longer emit a Kubernetes Secret destination —
# see ADR 0008 §"Operator-side delta".
#
# Enable on every consumer MC that has at least one consumer of the
# tunnel `:8443` port. Disable only on operator-only installs that
# don't host their own RemoteApp consumers.
trustBundle:
  enabled: true
  # Secret the singleton tbot writes svid_bundle.pem into. Mounted by
  # consumer pods in this namespace and referenced as their CA bundle.
  # Renaming this is a chart-upgrade rollout exercise — bump only if
  # the existing name conflicts with another component's Secret.
  secretName: tunnelport-spiffe-bundle
  # Teleport-central ProvisionToken name that admits this bot via the
  # kubernetes-join method. Required at install time; same shape as the
  # per-RemoteApp tokens — one entry on Central, one bot here. The
  # `static_jwks.allow` rule must list this Deployment's
  # ServiceAccount (default `<release>-trust-bundle`).
  tokenName: ""
  # Teleport-central WorkloadIdentity resource the bot's
  # workload-identity-x509 service binds to via a selector label.
  # `{ "trust-bundle": ["tunnelport"] }` is the chart default; the
  # corresponding WorkloadIdentity resource on Central must carry the
  # matching label. Distinct from per-CR `remoteapp:` selectors so the
  # bot can never accidentally claim a per-RemoteApp identity.
  workloadIdentityLabels:
    trust-bundle:
      - tunnelport
  # SVID lifetime / renewal cadence on the singleton bot. The SVID is
  # never presented to a verifier (the trust bundle is the artefact
  # consumers mount), so these only bound the renewal cycle, not the
  # security window. Matches per-CR bots' values.
  credentialTTL: 60m
  renewalInterval: 20m
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
