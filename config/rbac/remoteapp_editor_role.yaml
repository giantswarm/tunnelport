# This rule is not used by the project tunnelport itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the access.giantswarm.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tunnelport
    app.kubernetes.io/managed-by: kustomize
  name: remoteapp-editor-role
rules:
- apiGroups:
  - access.giantswarm.io
  resources:
  - remoteapps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - access.giantswarm.io
  resources:
  - remoteapps/status
  verbs:
  - get
