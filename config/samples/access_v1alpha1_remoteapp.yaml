apiVersion: access.giantswarm.io/v1alpha1
kind: RemoteApp
metadata:
  name: remoteapp-sample
  labels:
    app.kubernetes.io/name: tunnelport
    app.kubernetes.io/managed-by: kustomize
spec:
  appName: my-teleport-app
  port: 8080
  proxyAddr: teleport.example.com:443
  # Name of the Teleport ProvisionToken on Central. The operator's
  # kubernetes-join model (ADR 0004) does not deliver a static-token
  # Secret on the consumer cluster.
  tokenName: my-app-bot
  # The Teleport cluster name. The rendered tbot pod projects its
  # ServiceAccount JWT with this value as the `aud` claim, which
  # Teleport's `static_jwks` validator pins on its side.
  clusterName: teleport.example.com
