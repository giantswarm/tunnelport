# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests). The job creates a
# kind cluster; ATS applies its bundled CRDs (/etc/ats/crds, the
# prometheus-operator PodMonitor and PrometheusRule CRDs the chart's monitoring
# objects need are among them), installs the packaged chart with
# `helm upgrade --install --wait` (tests/test-values.yaml, the namespace below)
# and runs `pytest -m smoke` in tests/ats.
#
# The smoke (tests/ats/test_smoke.py) is the chart-level install check on a
# bare cluster: the chart installs, the RemoteApp CRD is established and the
# manager Deployment becomes ready with the image the branch build pushed
# (branchPublish in giantswarm/github makes execute-chart-tests wait on that
# push; the chart resolves the image tag from the stamped chart version). The
# tunnel itself, real Teleport included, is covered by the e2e-smoke job
# (hack/smoke/run.sh) and the chart rendering by chart-test; this job does not
# repeat either.
app-tests-app-config-file: tests/test-values.yaml
# The chart pins its objects to installNamespace (values.yaml), so the release
# goes there too.
app-tests-deploy-namespace: tunnelport-system

# functional: no second scenario. upgrade: an upgrade from the last release in
# the catalog is a follow-up.
skip-steps: [functional, upgrade]
